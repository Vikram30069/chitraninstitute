<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="100%" height="290">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080D1A"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5C062" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#8B1E1E" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5C062" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes floatCircle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .banner-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: url(#goldGrad);
    }
    .banner-subtitle {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4.5px;
      fill: #F1F5F9;
      text-transform: uppercase;
    }
    .banner-tagline {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      fill: #94A3B8;
      font-weight: 500;
    }
    .badge-pill {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(245, 192, 98, 0.45);
      stroke-width: 1;
      rx: 14;
    }
    .badge-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      fill: #FDE68A;
    }
    .circle-crest {
      animation: floatCircle 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Card -->
  <rect x="4" y="4" width="912" height="282" rx="24" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="1.8"/>
  
  <!-- Subtle Grid Pattern Accent -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="60" y1="0" x2="60" y2="290"/>
    <line x1="160" y1="0" x2="160" y2="290"/>
    <line x1="260" y1="0" x2="260" y2="290"/>
    <line x1="360" y1="0" x2="360" y2="290"/>
    <line x1="460" y1="0" x2="460" y2="290"/>
    <line x1="560" y1="0" x2="560" y2="290"/>
    <line x1="660" y1="0" x2="660" y2="290"/>
    <line x1="760" y1="0" x2="760" y2="290"/>
    <line x1="860" y1="0" x2="860" y2="290"/>
    <line x1="0" y1="72" x2="920" y2="72"/>
    <line x1="0" y1="145" x2="920" y2="145"/>
    <line x1="0" y1="218" x2="920" y2="218"/>
  </g>

  <!-- Golden Radial Glow Accent Behind Title -->
  <circle cx="460" cy="85" r="130" fill="#F59E0B" opacity="0.08" filter="url(#glow)"/>

  <!-- Logo Crest -->
  <g class="circle-crest" transform="translate(460, 48)">
    <circle cx="0" cy="0" r="28" fill="#1A130B" stroke="#F5C062" stroke-width="2.2" filter="url(#glow)"/>
    <text x="0" y="9" text-anchor="middle" font-size="22">🎨</text>
  </g>

  <!-- Title & Branding -->
  <text class="banner-title" x="460" y="118" text-anchor="middle">CHITRAN INSTITUTE</text>
  <text class="banner-subtitle" x="460" y="147" text-anchor="middle">THE CENTRE FOR FINE &amp; PERFORMING ARTS</text>
  <text class="banner-tagline" x="460" y="176" text-anchor="middle">Drawing &amp; Painting • Instrumental &amp; Vocal Music • Western &amp; Classical Dance • Handwriting</text>

  <!-- Badges Row -->
  <g transform=\"translate(125, 212)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="145" height="30" class="badge-pill"/>
    <text x="72" y="19" text-anchor="middle" class="badge-text">✨ Est. 2003 (23+ Yrs)</text>

    <!-- Badge 2 -->
    <rect x="160" y="0" width="165" height="30" class="badge-pill"/>
    <text x="242" y="19" text-anchor="middle" class="badge-text">🏛️ IFAA Affiliated</text>

    <!-- Badge 3 -->
    <rect x="340" y="0" width="165" height="30" class="badge-pill"/>
    <text x="422" y="19" text-anchor="middle" class="badge-text">🇮🇳 MSME Certified</text>

    <!-- Badge 4 -->
    <rect x="520" y="0" width="150" height="30" class="badge-pill"/>
    <text x="595" y="19" text-anchor="middle" class="badge-text">📍 Ashok Nagar, HYD</text>
  </g>
</svg>
